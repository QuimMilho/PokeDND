<mat-toolbar color="primary" class="app-toolbar">
  <a class="app-name" routerLink="/" i18n="@@appName">PokeDnD</a>
  @if (auth.signedIn()) {
    <nav class="main-nav" aria-label="Main" i18n-aria-label="@@mainNavLabel">
      <a mat-button routerLink="/cards" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" i18n="@@navCards">Cards</a>
      <a mat-button routerLink="/cards/export" routerLinkActive="active" i18n="@@navExport">Export</a>
    </nav>
  }
  <span class="spacer"></span>
  <nav class="lang-switch" aria-label="Language" i18n-aria-label="@@languageLabel">
    <a mat-button [href]="languageLink('en')" [attr.aria-current]="language === 'en' ? 'true' : null">EN</a>
    <a mat-button [href]="languageLink('pt')" [attr.aria-current]="language === 'pt' ? 'true' : null">PT</a>
  </nav>
  @if (auth.user(); as user) {
    <span class="user-name" data-testid="user-name">{{ user.displayName }}</span>
    <button mat-button type="button" (click)="logout()" data-testid="logout" i18n="@@logout">Log out</button>
  }
</mat-toolbar>

<router-outlet />
