<mat-toolbar color="primary" class="app-toolbar">
  <a class="app-name" routerLink="/" i18n="@@appName">PokeDnD</a>
  @if (menu().length) {
    <nav class="main-nav" aria-label="Main" i18n-aria-label="@@mainNavLabel" [class.signed-in]="auth.signedIn()">
      @for (item of menu(); track item.id) {
        <a
          mat-button
          [routerLink]="item.route"
          [class.active]="activeId() === item.id"
          [attr.aria-current]="activeId() === item.id ? 'page' : null"
          [attr.data-testid]="'nav-' + item.id"
          >{{ item.label() }}</a
        >
      }
    </nav>
  }
  <span class="spacer"></span>
  <nav class="lang-switch" aria-label="Language" i18n-aria-label="@@languageLabel">
    <a mat-button [href]="languageLink('en')" [attr.aria-current]="language === 'en' ? 'true' : null" data-testid="lang-en">EN</a>
    <a mat-button [href]="languageLink('pt')" [attr.aria-current]="language === 'pt' ? 'true' : null" data-testid="lang-pt">PT</a>
  </nav>
  @if (auth.user(); as user) {
    <span class="user-name" data-testid="user-name">{{ user.displayName }}</span>
    <button mat-button type="button" (click)="logout()" data-testid="logout" i18n="@@logout">Log out</button>
  }
</mat-toolbar>

<div class="page" [class.with-bottom-nav]="auth.signedIn()">
  <router-outlet />
</div>
