# PokeDnD API configuration. Secrets and connection details come from environment variables (chapter 13.5).
quarkus.application.name=pokednd-api
quarkus.http.port=8080
# The proxy in front of the API (Caddy) sets X-Forwarded-For; the rate limits need the real client address.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# --- Database ---
# The API runs on PostgreSQL (the default below), MySQL, MariaDB or MongoDB (chapter 16.3). Quarkus fixes the kind of database when
# the application is built, so the choice is a build option: ./gradlew build -PdbFlavour=mysql (see build.gradle), and the Docker
# image of each flavour is built with --build-arg FLAVOUR=... . The build sets quarkus.datasource.db-kind, the Flyway folder and the
# MongoDB settings for the flavour, which override the PostgreSQL values below. The connection always comes from the environment.
# --- PostgreSQL (default flavour) ---
# Set these environment variables (Quarkus reads them without any ${...} here):
#   QUARKUS_DATASOURCE_JDBC_URL   e.g. jdbc:postgresql://db:5432/pokednd
#   QUARKUS_DATASOURCE_USERNAME
#   QUARKUS_DATASOURCE_PASSWORD
quarkus.datasource.db-kind=postgresql
# Dev Services start a throw-away PostgreSQL in dev mode and in tests when Docker is present and no URL is set.

# SQL adapter: Hibernate ORM with Panache. The schema belongs to Flyway, never to Hibernate.
quarkus.hibernate-orm.schema-management.strategy=none
# JSON columns use the built-in Jackson mapper; nothing in this API customises it for REST.
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.jdbc.statement-batch-size=100
quarkus.flyway.migrate-at-start=true
# One folder per SQL dialect (chapter 16.3): postgresql, and mysql (shared by MySQL and MariaDB).
quarkus.flyway.locations=classpath:db/migration/postgresql

# --- MongoDB flavour ---
# QUARKUS_MONGODB_CONNECTION_STRING  e.g. mongodb://pokednd:secret@db-mongo:27017/pokednd?authSource=admin
# QUARKUS_MONGODB_DATABASE           the database to use (default pokednd, set by the build)
# The indexes are made by the versioned migrations in persistence/mongo/MongoMigrations.java when the API starts.

# --- Reference data (phase 21) ---
# The data bundle written by the importer (node tools/extract.mjs, then Core's ImporterCli). Loaded into the database at start
# when MANIFEST.json says it changed.
pokednd.bundle.dir=${POKEDND_BUNDLE_DIR:../build/bundle}
pokednd.reference.load-on-start=true
# The extracted resources: card art, icons and the language files (chapter 9.8)
pokednd.resources.dir=${POKEDND_RESOURCES_DIR:../resources}

# --- Where files live (export PDFs and skins) ---
pokednd.data.dir=${POKEDND_DATA_DIR:../build/data}

# --- Accounts (phase 22) ---
# The RSA key pair that signs the 15-minute access tokens (PEM text; line breaks may be written as \n). REQUIRED in production.
# The public key may be left out: it is then derived from the private key.
pokednd.auth.jwt-private-key=${POKEDND_JWT_PRIVATE_KEY:}
pokednd.auth.jwt-public-key=${POKEDND_JWT_PUBLIC_KEY:}
pokednd.auth.access-token-minutes=15
pokednd.auth.refresh-token-days=30
# An account with a password cannot log in until its e-mail is verified (phase 29). Accounts made with Discord are verified at once.
pokednd.auth.require-email-verification=true
# How long the links in the mails work
pokednd.auth.verify-token-hours=24
pokednd.auth.reset-token-minutes=60
# Send the refresh cookie only over HTTPS (turn off only for plain-http development)
pokednd.auth.cookie-secure=true
# The first site admin, created on first start when no admin exists yet
pokednd.auth.bootstrap-admin-email=${POKEDND_BOOTSTRAP_ADMIN_EMAIL:}
pokednd.auth.bootstrap-admin-password=${POKEDND_BOOTSTRAP_ADMIN_PASSWORD:}
# Rate limits (chapter 14.6)
pokednd.auth.rate-limit.login-per-ip-per-minute=20
pokednd.auth.rate-limit.login-failures-per-email=5
pokednd.auth.rate-limit.login-failures-window-minutes=10
pokednd.auth.rate-limit.register-per-ip-per-hour=10
pokednd.auth.rate-limit.email-flows-per-ip-per-hour=30
pokednd.auth.rate-limit.mails-per-address-per-hour=3
pokednd.auth.rate-limit.link-attempts-per-code-lifetime=10
pokednd.auth.rate-limit.link-codes-per-code-lifetime=5

# --- Public address, Discord and e-mail (phases 28 and 29) ---
# The public URL of the app. E-mail links point to <base>/verify-email?token=... and <base>/reset-password?token=...; the Discord
# redirect URL to register at Discord is <base>/api/v1/auth/oauth/discord/callback.
pokednd.base-url=${POKEDND_BASE_URL:http://localhost:4200}
# Discord sign-in is off while the client id is empty. Discord does not document PKCE for the authorization-code grant, so none is used:
# the client is confidential (it has a secret) and the random state value, bound to the browser by a cookie, protects the redirect.
pokednd.oauth.discord.client-id=${POKEDND_OAUTH_DISCORD_CLIENT_ID:}
pokednd.oauth.discord.client-secret=${POKEDND_OAUTH_DISCORD_CLIENT_SECRET:}
pokednd.oauth.discord.authorize-url=https://discord.com/oauth2/authorize
pokednd.oauth.discord.token-url=https://discord.com/api/oauth2/token
pokednd.oauth.discord.api-url=https://discord.com/api/users/@me
# SMTP (POKEDND_SMTP_*). With the dev profile of deploy/ the mails appear in Mailpit at http://localhost:8025.
quarkus.mailer.host=${POKEDND_SMTP_HOST:localhost}
quarkus.mailer.port=${POKEDND_SMTP_PORT:1025}
quarkus.mailer.username=${POKEDND_SMTP_USER:}
quarkus.mailer.password=${POKEDND_SMTP_PASSWORD:}
quarkus.mailer.from=${POKEDND_SMTP_FROM:PokeDnD <no-reply@localhost>}
# true = TLS from the start (port 465); otherwise the connection is upgraded to TLS when the server offers it
quarkus.mailer.tls=${POKEDND_SMTP_TLS:false}
quarkus.mailer.start-tls=OPTIONAL
quarkus.mailer.mock=false

# --- Games (phase 32) ---
# How many join codes one person may try in ten minutes (the codes have 6 characters, so guessing must be slow)
pokednd.games.join-attempts-per-10-minutes=10

# --- Trainers and skins (phase 38) ---
# A skin is a 64x64 PNG of at most this many bytes. It is read and written again (no metadata survives) and kept in <data dir>/skins.
pokednd.skins.max-bytes=65536
# How many times one person may look up a Minecraft name for a skin in a minute
pokednd.skins.username-lookups-per-minute=10
# Mojang's services for "copy the skin of a Minecraft name" (the tests replace the client, so they never use these)
pokednd.skins.mojang.profile-url=https://api.mojang.com/users/profiles/minecraft/
pokednd.skins.mojang.session-url=https://sessionserver.mojang.com/session/minecraft/profile/

# --- Card export (chapter 9.10) ---
pokednd.cards.export.max-cards-per-job=1500
pokednd.cards.export.file-ttl-hours=24
pokednd.cards.export.default-size-mm=63x88
pokednd.cards.export.default-paper=A4
pokednd.cards.export.bleed-mm=3
pokednd.cards.export.gap-mm=2
pokednd.cards.export.cleanup-every=10m
# How many export jobs one person may start per hour (rate limit)
pokednd.cards.export.max-jobs-per-hour=20

# --- Metrics: /q/metrics (Prometheus format) ---
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Tests ---
%test.pokednd.auth.cookie-secure=false
%test.pokednd.auth.bootstrap-admin-email=admin@example.test
%test.pokednd.auth.bootstrap-admin-password=correct horse battery staple
%test.pokednd.data.dir=build/test-data
%test.pokednd.cards.export.cleanup-every=1s
# Accounts made by the tests are used at once; the test that checks the "must verify" rule switches it on with a test profile.
%test.pokednd.auth.require-email-verification=false
%test.pokednd.base-url=http://app.test
%test.quarkus.mailer.start-tls=DISABLED
# Log everything of ours, so the test that looks for secrets in the logs has something to look at
%test.quarkus.log.category."net.quimmilho.pokednd".level=DEBUG

# --- Realtime: WebSockets /ws/app and /ws/mod (phase 40, chapters 14.3, 14.7, 18.2 to 18.5) ---
# Messages up to 1 MB (a world-file patch can be large). The server pings every 20 seconds, as the protocol says.
quarkus.websockets-next.server.max-message-size=1048576
quarkus.websockets-next.server.auto-ping-interval=20s
# Rate limit of one connection (chapter 14.6): the app, and the mod (which sends positions in batches)
pokednd.realtime.app-messages-per-second=20
pokednd.realtime.mod-messages-per-second=200
# How many message ids are remembered to ignore repeats
pokednd.realtime.dedupe-size=1000
# A mod must say hello, and an app must send auth, within this time; a peer silent for the idle time is gone (3 heartbeats and a little more)
pokednd.realtime.hello-timeout-seconds=10
pokednd.realtime.auth-timeout-seconds=10
pokednd.realtime.idle-timeout-seconds=70
