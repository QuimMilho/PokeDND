verify.subject=Confirme o seu endereço de e-mail do PokeDnD
verify.body=Olá %NAME%,\n\nBem-vindo ao PokeDnD! Confirme o seu endereço de e-mail com esta ligação (funciona uma vez e expira em %HOURS% horas):\n\n%LINK%\n\nSe não criou uma conta, pode ignorar este e-mail.
reset.subject=Reponha a sua palavra-passe do PokeDnD
reset.body=Olá %NAME%,\n\nAlguém pediu para repor a palavra-passe da sua conta do PokeDnD. Escolha uma nova com esta ligação (funciona uma vez e expira em %MINUTES% minutos):\n\n%LINK%\n\nSe não foi você, pode ignorar este e-mail: a sua palavra-passe não mudou.
