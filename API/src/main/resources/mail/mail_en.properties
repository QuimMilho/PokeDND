verify.subject=Confirm your PokeDnD e-mail address
verify.body=Hi %NAME%,\n\nWelcome to PokeDnD! Confirm your e-mail address with this link (it works once and expires in %HOURS% hours):\n\n%LINK%\n\nIf you did not create an account, you can ignore this e-mail.
reset.subject=Reset your PokeDnD password
reset.body=Hi %NAME%,\n\nSomebody asked to reset the password of your PokeDnD account. Choose a new one with this link (it works once and expires in %MINUTES% minutes):\n\n%LINK%\n\nIf it was not you, you can ignore this e-mail: your password has not changed.
