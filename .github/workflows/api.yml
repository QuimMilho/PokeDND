# API: build and test against the Core in Maven local (spec 13.4, 13.6).
# Later phases add the integration tests against each database (Testcontainers) and the image builds.
name: api

on:
  push:
    paths:
      - "API/**"
      - "Core/**" # the API builds against Core
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "API/**"
      - "Core/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Build and test the API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Core goes to Maven local first: the API needs net.quimmilho.pokednd:core
      - name: Publish Core to Maven local
        working-directory: Core
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal
      - name: Build and test the API
        working-directory: API
        run: |
          chmod +x gradlew
          ./gradlew build
