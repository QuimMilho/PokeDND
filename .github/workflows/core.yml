# Core: build, unit tests, publish to Maven local (spec 13.4, 13.6).
name: core

on:
  push:
    paths:
      - "Core/**"
      # The importer tests read resources/, which tools/extract.mjs builds from the Cobblemon jar
      - "tools/extract.mjs"
      - "tools/build-csv.mjs"
      - "tools/extract.config.json"
      - "tools/lib/**"
      - "tools/ported-posers/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "Core/**"
      # The importer tests read resources/, which tools/extract.mjs builds from the Cobblemon jar
      - "tools/extract.mjs"
      - "tools/build-csv.mjs"
      - "tools/extract.config.json"
      - "tools/lib/**"
      - "tools/ported-posers/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Build and test Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The importer reads resources/. It is not stored in git, so build it here (no icons: the importer does not read them).
      - name: Rebuild resources/ from the Cobblemon jar
        working-directory: .
        run: node tools/extract.mjs --no-icons
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test (also checks that Core only depends on Jackson and SLF4J)
        env:
          POKEDND_REQUIRE_RESOURCES: "true" # fail, do not skip, if resources/ is missing
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Publish to Maven local (what the API and the Mod build against)
        run: ./gradlew publishToMavenLocal
      - name: Keep the jars as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-jars
          path: Core/build/libs/*.jar
          if-no-files-found: error
