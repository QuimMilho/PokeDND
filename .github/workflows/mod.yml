# Mod: build the Fabric mod (spec 13.6).
# Later phases add the Fabric GameTests on a headless server, and the Core jar-in-jar (13.4), at which
# point Core is published to Maven local first, exactly as in api.yml.
name: mod

on:
  push:
    paths:
      - "Mod/**"
      - ".github/workflows/mod.yml"
  pull_request:
    paths:
      - "Mod/**"
      - ".github/workflows/mod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Build the mod
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Mod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Keep the mod jar as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-jar
          path: Mod/build/libs/*.jar
          if-no-files-found: error
